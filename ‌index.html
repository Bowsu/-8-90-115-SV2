<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統測農業概論線上測驗</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-xl md:text-2xl font-bold tracking-wide">
            <strong>統測農業概論第8章林業經營管理(90-115學年)</strong>
        </h1>
    </header>

    <!-- 主要內容區 -->
    <main class="container mx-auto px-4 py-8 max-w-3xl flex-grow">

        <!-- 1. 設定畫面 -->
        <div id="setup-screen" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-6">
            <h2 class="text-xl font-bold text-emerald-800 border-b pb-3">測驗參數設定</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-semibold mb-2 text-slate-700">選擇測驗題數：</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <label class="border rounded-xl p-3 flex items-center justify-center cursor-pointer hover:bg-emerald-50 transition">
                            <input type="radio" name="num-questions" value="20" class="mr-2 accent-emerald-600" checked> 20 題
                        </label>
                        <label class="border rounded-xl p-3 flex items-center justify-center cursor-pointer hover:bg-emerald-50 transition">
                            <input type="radio" name="num-questions" value="40" class="mr-2 accent-emerald-600"> 40 題
                        </label>
                        <label class="border rounded-xl p-3 flex items-center justify-center cursor-pointer hover:bg-emerald-50 transition">
                            <input type="radio" name="num-questions" value="50" class="mr-2 accent-emerald-600"> 50 題
                        </label>
                        <label class="border rounded-xl p-3 flex items-center justify-center cursor-pointer hover:bg-emerald-50 transition">
                            <input type="radio" name="num-questions" value="all" class="mr-2 accent-emerald-600"> 全部試題
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-slate-700">選題模式：</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border rounded-xl p-3 flex items-center justify-center cursor-pointer hover:bg-emerald-50 transition">
                            <input type="radio" name="sort-mode" value="random" class="mr-2 accent-emerald-600" checked> 隨機選題
                        </label>
                        <label class="border rounded-xl p-3 flex items-center justify-center cursor-pointer hover:bg-emerald-50 transition">
                            <input type="radio" name="sort-mode" value="sequential" class="mr-2 accent-emerald-600"> 依題號順序選題
                        </label>
                    </div>
                </div>
            </div>

            <button onclick="startQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 text-lg">
                開始測驗
            </button>
        </div>

        <!-- 2. 測驗進行畫面 -->
        <div id="quiz-screen" class="hidden bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-6">
            <div class="flex justify-between items-center text-sm font-semibold text-slate-500 border-b pb-3">
                <span id="progress-indicator">題目：1 / 20</span>
                <span id="score-indicator">目前得分：0</span>
            </div>

            <div id="question-container" class="space-y-4">
                <h3 id="question-text" class="text-lg md:text-xl font-bold text-slate-800 leading-relaxed"></h3>
                <div id="options-container" class="space-y-3">
                    <!-- 選項按鈕會動態載入 -->
                </div>
            </div>

            <!-- 解析區塊 -->
            <div id="explanation-box" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-4 space-y-2">
                <h4 class="font-bold text-amber-800 flex items-center">
                    <svg class="w-5 h-5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    試題詳細解析
                </h4>
                <p id="explanation-text" class="text-slate-700 text-sm leading-relaxed"></p>
                <p id="source-page" class="text-xs text-emerald-700 font-semibold pt-1"></p>
            </div>

            <div class="flex justify-between pt-4 border-t">
                <button id="btn-toggle-exp" onclick="toggleExplanation()" class="hidden bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-xl font-semibold transition text-sm">
                    查看解析
                </button>
                <button id="btn-next" onclick="nextQuestion()" class="hidden ml-auto bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold transition shadow-md">
                    下一題
                </button>
            </div>
        </div>

        <!-- 3. 結果與錯題大鍋菜畫面 -->
        <div id="result-screen" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 text-center space-y-4">
                <h2 class="text-2xl font-bold text-slate-800">測驗結算結果</h2>
                <div class="inline-block bg-emerald-100 text-emerald-800 text-4xl font-black px-8 py-4 rounded-2xl shadow-inner">
                    <span id="final-score">100</span> 分
                </div>
                <p id="result-summary" class="text-slate-600 font-medium"></p>
                <button onclick="resetToSetup()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition">
                    重新設定並再次測驗
                </button>
            </div>

            <!-- 錯題大鍋菜區塊 -->
            <div id="wrong-answers-section" class="bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-6 hidden">
                <h3 class="text-xl font-bold text-rose-700 border-b pb-3 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    錯題大鍋菜（錯題訂正與詳解彙整）
                </h3>
                <div id="wrong-list" class="space-y-6">
                    <!-- 錯題卡片動態插入 -->
                </div>
            </div>
        </div>

    </main>

    <!-- 底部版權 -->
    <footer class="text-center py-4 text-xs text-slate-400">
        統測農業概論數位輔助學習系統 &copy; 2026
    </footer>

    <!-- 完整題庫資料庫（收錄全部試題） -->
    <script>
        const fullQuestionBank = [

                "詳細解析": "恆春半島常見銀葉樹與白榕等熱帶海岸林植物（教科書第10頁）。",

            },
            {
                "題目": "臺灣水青岡是臺灣珍貴稀有的植物之一，而造成此物種瀕臨絕種主要原因為何？",
                "選項": { "A": "生態系或生育地遭受破壞", "B": "分布生育地過於狹隘", "C": "因金錢利益遭受過度採伐", "D": "外來種不適合臺灣環境" },
                "正確答案": "B",
                "詳細解析": "臺灣水青岡分布生育地過於狹隘（教科書第30頁）。",
                "出自課本頁數": "第 30 頁"
            },
            {
                "題目": "下列有關木材物理性質的敘述，何者正確？",
                "選項": { "A": "木材的收縮膨脹以縱向收縮最大", "B": "木材含水率很低時，為熱及電之良好導體", "C": "鋼琴細膩音色源自木材具有良好的振動與共鳴", "D": "當木材細胞間隙或細胞腔水分已完全散失，而細胞壁中完全被水飽和時的含水率，稱為平衡含水率" },
                "正確答案": "C",
                "詳細解析": "樂器細膩音色源自木材具有良好的振動與共鳴（教科書第41頁）。",
                "出自課本頁數": "第 41 頁"
            },
            {
                "題目": "小中有一塊5公頃面積長方型林地，欲種植牛樟人工林投資，其中有2 / 5面積想採用林下栽植 ( 牛樟與臺灣山茶 ) 的方式經營，以便在漫長的輪伐期中，也能有短期山茶的收益。在行、株距為5 × 5公尺的條件下，以正三角形植樹法約需要多少牛樟苗木？",
                "選項": { "A": "924", "B": "1386", "C": "2000", "D": "2310" },
                "正確答案": "A",
                "詳細解析": "林下栽植面積 $2$ 公頃 $= 20,000$ 平方公尺。$R = 1.155 \\times (20,000 / 25) = 924$ 株（教科書第17頁）。",
                "出自課本頁數": "第 17 頁"
            },
            {
                "題目": "近年全球因聖嬰現象導致極端乾旱，引發多起大規模森林火災。火災過後，若政府林業部門採「不人為干預」方針，讓林地由殘留根部萌芽或天然種子自然恢復，這類演替而來的森林稱為：",
                "選項": { "A": "次生林", "B": "原始林", "C": "人工林", "D": "混農林" },
                "正確答案": "A",
                "詳細解析": "次生林是指經人為干擾後再經天然更新建立的森林（教科書第8頁）。",
                "出自課本頁數": "第 8 頁"
            },
            {
                "題目": "苗栗地區頻傳石虎出沒，政府推動「瀕危物種及重要棲地生態服務給付推動方案」，鼓勵農民保護棲地及原生物種，這屬於「就地保育 ( in situ )」；若發現受傷個體送往生物多樣性研究所進行「域外保育 ( ex situ )」，暫時照養後野放。這兩種不同保育策略定義上的主要差別在於：",
                "選項": { "A": "保育區域面積上的差異", "B": "保育物種是否在原棲息地", "C": "依保育物種的族群大小而定", "D": "保育物種是否有經過人工繁殖的程序" },
                "正確答案": "B",
                "詳細解析": "差別在於保育物種是否在原棲息地（教科書第31、33頁）。",
                "出自課本頁數": "第 31、33 頁"
            },
            {
                "題目": "2025年臺灣正式進入「碳排有價」時代，許多企業透過參與森林碳匯專案來達成自主減量目標。森林能透過光合作用，將大氣中的二氧化碳轉化為有機碳並固定在生物量中。這種在一定時間內 ( 如一年 )，森林捕捉並固定二氧化碳的「動態過程」或「速率能力」，在專業術語中稱為：",
                "選項": { "A": "碳貯存 ( Carbon storage )", "B": "碳交易 ( Carbon trade )", "C": "碳替代 ( Carbon substitution )", "D": "碳吸存 ( Carbon sequestration )" },
                "正確答案": "D",
                "詳細解析": "碳吸存是指林木生長過程中每年所吸收固定碳量的動態過程與速率能力（教科書第35頁）。",
                "出自課本頁數": "第 35 頁"
            },
            {
                "題目": "在全球「減塑」與「綠色包裝」趨勢下，許多包材改由紙類取代。若某公司開發兩款產品：一款是追求質感的高級禮盒 ( 可長時間保存且紙質潔白 )，另一款是強調環保、低成本的物流緩衝墊 ( 如報紙類緩衝材 )。關於這兩款紙張製程所使用的「化學紙漿」與「機械紙漿」，下列敘述何者正確？",
                "選項": { "A": "機械紙漿製程會將木質素全部溶解，因此纖維純度最高，適合做高級禮盒", "B": "化學紙漿保留了木材中大量的木質素，目的是為了提升紙張對環境濕度的抗性", "C": "化學紙漿主要以磨碎方式解離纖維，完全不改變木質素含量，目的是為了增加硬度", "D": "機械紙漿因保留較多木質素，產出的紙張在空氣中容易受光氧化而黃化，常用於生產報紙或短期包材" },
                "正確答案": "D",
                "詳細解析": "機械紙漿保留較多木質素，易受光氧化而黃化，常用於短期包材或報紙（教科書第46-47頁）。",
                "出自課本頁數": "第 46-47 頁"
            },
            {
                "題目": "果農阿笠觀察到國內市場有許多美國進口水果，如果他希望自己的產品具有競爭優勢。應就氣候考量，於高雄種植下列何種果樹？",
                "選項": { "A": "桃", "B": "蘋果", "C": "葡萄", "D": "番石榴" },
                "正確答案": "D",
                "詳細解析": "高雄氣候炎熱，最適合種植熱帶適應良好的番石榴（芭樂）。",
                "出自課本頁數": "第 3、10 頁"
            }
        ];

        let quizData = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];
        let totalQuestionsConfig = 20;

        function startQuiz() {
            const numVal = document.querySelector('input[name="num-questions"]:checked').value;
            const sortMode = document.querySelector('input[name="sort-mode"]:checked').value;

            // 複製題庫
            let pool = [...fullQuestionBank];

            // 決定題數（當選擇 all 時，精確對應題庫全部長度）
            if (numVal === 'all') {
                totalQuestionsConfig = pool.length;
            } else {
                totalQuestionsConfig = parseInt(numVal);
                if (pool.length < totalQuestionsConfig) {
                    totalQuestionsConfig = pool.length;
                }
            }

            // 排序模式
            if (sortMode === 'random') {
                pool.sort(() => Math.random() - 0.5);
            }

            quizData = pool.slice(0, totalQuestionsConfig);
            currentIndex = 0;
            score = 0;
            userAnswers = [];

            // 切換畫面
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            renderQuestion();
        }

        function renderQuestion() {
            const q = quizData[currentIndex];
            document.getElementById('progress-indicator').innerText = `題目：${currentIndex + 1} / ${quizData.length}`;
            document.getElementById('score-indicator').innerText = `目前得分：${score}`;
            document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.題目}`;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            for (let key in q.選項) {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-emerald-50 hover:border-emerald-300 transition font-medium text-slate-700 flex items-center space-x-3";
                btn.innerHTML = `<span class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-slate-600">${key}</span><span>${q.選項[key]}</span>`;
                btn.onclick = () => selectOption(key);
                optContainer.appendChild(btn);
            }

            // 隱藏解析與下一題按鈕
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('btn-toggle-exp').classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');
        }

        function selectOption(selectedKey) {
            const q = quizData[currentIndex];
            const isCorrect = (selectedKey === q.正確答案);
            const pointsPerQuestion = 100 / quizData.length;

            if (isCorrect) {
                score += pointsPerQuestion;
            }

            // 記錄作答
            userAnswers.push({
                question: q.題目,
                options: q.選項,
                userAnswer: selectedKey,
                correctAnswer: q.正確答案,
                explanation: q.詳細解析,
                sourcePage: q.出自課本頁數,
                isCorrect: isCorrect
            });

            // 鎖定選項並顯示顏色
            const optButtons = document.getElementById('options-container').children;
            for (let btn of optButtons) {
                btn.disabled = true;
                const keySpan = btn.querySelector('span').innerText;
                if (keySpan === q.正確答案) {
                    btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                } else if (keySpan === selectedKey && !isCorrect) {
                    btn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }

            // 顯示解析按鈕與下一題按鈕
            document.getElementById('btn-toggle-exp').classList.remove('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('score-indicator').innerText = `目前得分：${Math.round(score)}分`;
        }

        function toggleExplanation() {
            const box = document.getElementById('explanation-box');
            const q = quizData[currentIndex];
            document.getElementById('explanation-text').innerText = q.詳細解析;
            document.getElementById('source-page').innerText = `依據課本：${q.出自課本頁數}`;
            box.classList.toggle('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizData.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const finalScoreRounded = Math.round(score);
            document.getElementById('final-score').innerText = finalScoreRounded;

            const correctCount = userAnswers.filter(ans => ans.isCorrect).length;
            document.getElementById('result-summary').innerText = `總題數：${quizData.length} 題 | 答對：${correctCount} 題 | 答錯：${quizData.length - correctCount} 題`;

            // 處理錯題大鍋菜
            const wrongItems = userAnswers.filter(ans => !ans.isCorrect);
            const wrongSection = document.getElementById('wrong-answers-section');
            const wrongList = document.getElementById('wrong-list');
            wrongList.innerHTML = '';

            if (wrongItems.length > 0) {
                wrongSection.classList.remove('hidden');
                wrongItems.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = "bg-rose-50 border border-rose-200 rounded-xl p-5 space-y-3";
                    card.innerHTML = `
                        <h4 class="font-bold text-rose-900 text-base">錯題 ${idx + 1}：${item.question}</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
                            <div class="bg-white p-3 rounded-lg border border-rose-100"><span class="font-semibold text-rose-600">您的作答：</span> ${item.userAnswer}. ${item.options[item.userAnswer] || ''}</div>
                            <div class="bg-white p-3 rounded-lg border border-emerald-100"><span class="font-semibold text-emerald-600">正確答案：</span> ${item.correctAnswer}. ${item.options[item.correctAnswer]}</div>
                        </div>
                        <div class="bg-white p-4 rounded-lg border border-slate-200 space-y-1">
                            <p class="text-xs font-bold text-slate-500">詳盡解析（依據課本）：</p>
                            <p class="text-slate-700 text-sm leading-relaxed">${item.explanation}</p>
                            <p class="text-xs text-emerald-700 font-semibold pt-1">${item.sourcePage}</p>
                        </div>
                    `;
                    wrongList.appendChild(card);
                });
            } else {
                wrongSection.classList.add('hidden');
            }
        }

        function resetToSetup() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>

</html>
